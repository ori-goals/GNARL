[build-system]
requires = ["setuptools", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "gnarl"
version = "1.0.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "dm-clrs==2.0.3",
    "torch==2.6.0",
    "torch_geometric==2.6.1",
    "numpy==2.1.3",
    "gymnasium==0.29.1",
    "matplotlib==3.10.1",
    "wandb==0.19.11",
    "sb3_contrib==2.6.0",
    "tqdm==4.67.1",
    "pybind11==2.13.6",
	"pulp==3.2.2",
	"tensorboard",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gnarl*", "third_party*"]
